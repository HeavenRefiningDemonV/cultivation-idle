<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tempering Court · Cultivation Idle</title>
<style>
:root{
  --paper:#f3ead7; --paper-warm:#efe3c9; --paper-deep:#e7d9ba; --paper-shade:#d9c79e;
  --ink:#1f1a17; --ink-70:rgba(31,26,23,.70); --ink-45:rgba(31,26,23,.45);
  --ink-25:rgba(31,26,23,.25); --ink-12:rgba(31,26,23,.12);
  --jade:#4e6b5e; --jade-deep:#0f6f5a; --jade-ink:#2f4a40;
  --gold:#a2712a; --gold-bright:#b2832d; --gold-pale:#d9bd80; --gold-deep:#84591b; --bronze:#7a5b26;
  --cinnabar:#8b3028; --cinnabar-bright:#a94835; --cinn-deep:#6e241e;
  --el-wood:#2d7844; --el-fire:#a44731; --el-earth:#8d642d; --el-metal:#69717c; --el-water:#2a668d;
  --serif:Georgia,"Songti SC","Noto Serif SC",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0c0905;display:grid;place-items:center;font-family:var(--serif);color:var(--ink);overflow:auto}
.th-viewport{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}
.stage{position:relative;width:2048px;height:1152px;transform-origin:top center;
  background:radial-gradient(60% 50% at 50% 0%, #3a2c1a, transparent 70%),linear-gradient(160deg, #2a2013, #1c150d 60%, #140e08);
  display:grid;gap:12px;padding:15px;grid-template-rows:116px 768px 150px 52px;}
.stage::after{content:"";position:absolute;inset:6px;z-index:60;pointer-events:none;border-radius:3px;
  border:1px solid rgba(178,131,45,.55);outline:1px solid rgba(120,86,38,.32);outline-offset:3px;}

/* PANEL MATERIAL */
.panel{position:relative;border-radius:4px;overflow:hidden;
  background:linear-gradient(168deg, var(--paper-warm), var(--paper) 42%, var(--paper-deep));
  box-shadow:0 6px 20px rgba(0,0,0,.45), inset 0 0 60px rgba(120,90,46,.06);}
.panel::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 30% at 8% 6%,rgba(120,82,40,.12),transparent 70%),
    radial-gradient(36% 28% at 94% 92%,rgba(120,82,40,.12),transparent 70%),
    radial-gradient(50% 40% at 50% 46%,rgba(255,250,236,.30),transparent 72%),
    radial-gradient(3% 3% at 22% 70%,rgba(120,82,40,.12),transparent 60%),
    radial-gradient(2.5% 2.5% at 76% 28%,rgba(120,82,40,.10),transparent 60%),
    radial-gradient(2% 2% at 62% 82%,rgba(120,82,40,.14),transparent 60%),
    radial-gradient(120% 120% at 50% 50%,transparent 60%,rgba(64,42,22,.34));}
.content{position:relative;z-index:3;height:100%;padding:18px;}
.grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.5;mix-blend-mode:multiply;}
.grain svg{width:100%;height:100%;display:block}
.gframe{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:4px;border:2.5px solid transparent;
  background:linear-gradient(135deg,#e7cd92,#a2712a 45%,#6e4c16) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;}
.gframe2{position:absolute;inset:5px;z-index:7;pointer-events:none;border:1px solid rgba(162,113,42,.45);border-radius:2px;}
.gc{position:absolute;width:15px;height:15px;z-index:8;pointer-events:none;border:0 solid var(--gold);}
.gc.tl{left:6px;top:6px;border-left-width:2px;border-top-width:2px;}
.gc.tr{right:6px;top:6px;border-right-width:2px;border-top-width:2px;}
.gc.bl{left:6px;bottom:6px;border-left-width:2px;border-bottom-width:2px;}
.gc.br{right:6px;bottom:6px;border-right-width:2px;border-bottom-width:2px;}
.banner{position:absolute;top:-1px;left:50%;transform:translateX(-50%);z-index:9;white-space:nowrap;
  padding:4px 22px;font:700 12px/1 var(--serif);letter-spacing:.15em;color:var(--gold-pale);
  background:linear-gradient(180deg, var(--jade-ink), #20352d 55%, #182a23);
  border:1px solid var(--gold-deep);border-radius:0 0 3px 3px;
  box-shadow:0 3px 6px rgba(20,14,8,.5), inset 0 1px 0 rgba(217,189,128,.35);}
.banner::before,.banner::after{content:"";position:absolute;top:50%;width:8px;height:8px;
  background:linear-gradient(135deg,#e7cd92,#84591b);transform:translateY(-50%) rotate(45deg);}
.banner::before{left:-4px}.banner::after{right:-4px}
.banner.cinn{background:linear-gradient(180deg,#7a2a22,#601e18 55%,#4e150f);}
.banner b{color:#fff;font-weight:700}
.tag{position:absolute;left:13px;top:13px;width:46px;height:80px;z-index:10;
  background:linear-gradient(160deg,#9a3b30,#7a2a22 55%,#5e1c16);border:1px solid var(--cinn-deep);border-radius:3px;
  box-shadow:0 3px 8px rgba(30,12,8,.5), inset 0 1px 0 rgba(255,200,180,.3);display:grid;place-items:center;}
.tag .glyphs{writing-mode:vertical-rl;font-family:var(--kai);font-weight:700;font-size:18px;letter-spacing:4px;color:#f4dccb;text-shadow:0 1px 2px rgba(40,10,6,.6);}
.gcol{position:absolute;top:44px;writing-mode:vertical-rl;font-family:var(--kai);font-weight:700;font-size:42px;letter-spacing:16px;color:rgba(31,26,23,.055);z-index:2;pointer-events:none;}
.btn{display:inline-block;padding:4px 11px;font:700 10.5px var(--serif);color:#3a2a0e;cursor:pointer;
  background:linear-gradient(180deg,#f0e2bf,#dcc591);border:1px solid var(--gold-deep);border-radius:3px;
  box-shadow:0 1px 2px rgba(60,40,16,.3), inset 0 1px 0 rgba(255,250,235,.5);user-select:none;}
.btn.jade{background:linear-gradient(180deg,#3a5b4d,#274034);color:#e9efe2;border-color:#1c3128;}
.btn.big{padding:7px 20px;font:700 13px var(--serif);}
.btn.is-disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.3);}
.btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}
.btn:active{transform:scale(.97);}
.chip{font:800 9px var(--serif);letter-spacing:.05em;padding:1px 6px;border-radius:2px;display:inline-block;}
.chip.jade{background:rgba(15,111,90,.15);color:var(--jade-deep);border:1px solid rgba(15,111,90,.4);}
.chip.gold{background:rgba(162,113,42,.15);color:var(--gold-deep);border:1px solid rgba(162,113,42,.45);}
.chip.cinn{background:rgba(139,48,40,.15);color:var(--cinn-deep);border:1px solid rgba(139,48,40,.45);}
.chip.ink{background:rgba(31,26,23,.08);color:var(--ink-70);border:1px solid var(--ink-25);}
.sub{font:700 9.5px var(--serif);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-45);}
.rchip{font:700 10px var(--serif);color:var(--ink-70);background:var(--paper-deep);border:1px solid var(--ink-25);border-radius:2px;padding:2px 8px;display:inline-block;}
.micro{font:600 10px var(--serif);letter-spacing:.02em;color:var(--ink-70);}
.val{font:800 11px var(--serif);color:var(--ink);}

/* LINTEL */
.lintel-grid{display:grid;grid-template-columns:86px 1fr auto;height:100%;align-items:center;gap:18px;padding:0 20px 0 0;}
.lintel-title{font:700 19px var(--serif);letter-spacing:.04em;display:flex;align-items:center;gap:12px;}
.lintel-sub{font-style:italic;color:var(--ink-70);font-size:12px;margin-top:2px;}
.realm-pips{display:flex;gap:4px;margin-top:6px;align-items:center}
.rp{width:13px;height:6px;border-radius:1px;background:var(--paper-shade);box-shadow:inset 0 0 0 1px var(--ink-12)}
.rp.on{background:linear-gradient(180deg,#f0d896,#a2712a)}
.rp.cur{box-shadow:0 0 0 1.5px var(--jade-deep)}
.lintel-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.lintel-roller{position:absolute;top:4px;bottom:4px;width:14px;z-index:6;border-radius:2px;background:linear-gradient(90deg,#4a330e,#8a6a36 50%,#4a330e);box-shadow:inset 0 0 0 1px rgba(178,131,45,.4);}
.lintel-roller.l{left:4px}.lintel-roller.r{right:4px}

/* SHELF */
.shelf-scroll{height:100%;overflow-y:auto;padding-right:6px;display:flex;flex-direction:column;gap:11px;}
.shelf-scroll::-webkit-scrollbar{width:6px}.shelf-scroll::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
.plaque{position:relative;border-radius:3px;padding:10px 12px;cursor:pointer;background:linear-gradient(168deg,var(--paper-warm),var(--paper-deep));
  box-shadow:inset 0 0 0 1px rgba(162,113,42,.35), 0 2px 5px rgba(40,28,12,.25);transition:box-shadow .14s ease, transform .14s ease;}
.plaque:hover{box-shadow:inset 0 0 0 1px rgba(162,113,42,.6), 0 3px 8px rgba(40,28,12,.3);transform:translateY(-1px);}
.plaque.sel{box-shadow:inset 0 0 0 2px var(--jade-deep), 0 0 14px rgba(15,111,90,.35);}
.plaque .pname{font:600 14px var(--serif);}
.plaque .proom{font:600 11px var(--serif);color:var(--ink-70);display:flex;align-items:center;gap:5px}
.plaque .pforge{font:600 10px var(--serif);color:var(--ink-45);margin-top:3px;}
.plaque .psel{position:absolute;right:8px;top:8px;}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--gold-deep);}
.pip.on{background:var(--gold)}.pip.off{background:transparent}
.ladder{display:flex;gap:2px;margin-top:6px;align-items:center}
.notch{width:23px;height:7px;border-radius:1px;background:var(--paper-shade);position:relative}
.notch.on{background:linear-gradient(180deg,#f0d896,#a2712a);}
.notch.cur{box-shadow:0 0 0 1.5px var(--jade-deep);}
.notch .trait{position:absolute;top:-9px;left:50%;transform:translateX(-50%);color:var(--gold-deep);font-size:8px}
.slip{position:relative;border-radius:3px;padding:9px 12px 9px 40px;background:repeating-linear-gradient(135deg,rgba(31,26,23,.045) 0 6px,transparent 6px 12px), var(--paper-deep);
  border:1.5px dashed var(--ink-25);filter:grayscale(.45);opacity:.82;}
.slip .seal-lock{position:absolute;left:8px;top:50%;transform:translateY(-50%)}
.slip .sname{font:600 13px var(--serif);color:var(--ink-45);}
.divider{font:700 9px var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-25);text-align:center;margin:2px 0;display:flex;align-items:center;gap:8px;justify-content:center}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--ink-12)}

/* ROOM layers */
.room-atmos{position:absolute;inset:0;z-index:2;pointer-events:none;}
.room-scene{position:absolute;inset:0;z-index:2;pointer-events:none;}
.room-scene svg{width:100%;height:100%;display:block}
.room-fig{position:absolute;inset:0;z-index:3;pointer-events:none;}
.room-fig svg{width:100%;height:100%;display:block}
.room-smoke{position:absolute;inset:0;z-index:4;pointer-events:none;}
.room-smoke svg{width:100%;height:100%;display:block}
.room-corner{position:absolute;z-index:5;width:78px;height:78px;pointer-events:none;opacity:.5}
.room-corner.tl{left:10px;top:30px}.room-corner.tr{right:10px;top:30px;transform:scaleX(-1)}
.room-corner.bl{left:10px;bottom:74px;transform:scaleY(-1)}.room-corner.br{right:10px;bottom:74px;transform:scale(-1,-1)}
.room-seal{position:absolute;right:22px;top:30px;z-index:6;text-align:center;}
.room-seal .lbl{margin-top:4px}
.room-scrim{position:absolute;inset:0;z-index:5;pointer-events:none;}
.mlabel{position:absolute;z-index:6;font:700 9px var(--serif);letter-spacing:.04em;white-space:nowrap;text-shadow:0 1px 2px rgba(20,14,8,.5)}
.mlabel .mv{font-weight:800;font-size:10px}
.forges{position:absolute;left:24px;right:24px;bottom:24px;height:42px;z-index:6;display:flex;align-items:center;gap:8px;padding:0 16px;
  border-top:1px solid rgba(162,113,42,.5);background:rgba(243,234,215,.78);border-radius:3px;font:600 12px var(--serif);box-shadow:0 -2px 8px rgba(30,20,10,.15);}
.forges .v{font-weight:800}
.lens{position:absolute;left:24px;bottom:84px;width:330px;z-index:6;border-radius:3px;
  background:linear-gradient(168deg,rgba(239,227,201,.97),rgba(231,217,186,.97));box-shadow:inset 0 0 0 1px rgba(162,113,42,.4), 0 6px 16px rgba(30,20,10,.4);padding:25px 12px 10px;}
.lens .lensbar{position:absolute;top:-1px;left:14px;font:700 9px var(--serif);letter-spacing:.14em;color:var(--gold-pale);background:linear-gradient(180deg,var(--jade-ink),#182a23);border:1px solid var(--gold-deep);border-radius:0 0 3px 3px;padding:3px 10px;}
.lens .head{display:flex;justify-content:space-between;align-items:center;font:800 16px var(--serif);margin-bottom:3px}
.lens .row{display:flex;justify-content:space-between;font:600 10.5px var(--serif);color:var(--ink-70);padding:1px 0;}
.lens .row .nm{color:var(--ink-45)}
.dir-up{color:var(--jade-deep)}.dir-flat{color:var(--ink-45)}.dir-down{color:var(--gold-deep)}.dir-bad{color:var(--cinn-deep)}

/* FOUNDATION */
.fcol{height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px;}
.fcol::-webkit-scrollbar{width:6px}.fcol::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
.fsummary{display:flex;align-items:center;gap:8px;font:600 11px var(--serif);}
.frow{display:flex;align-items:center;gap:7px;}
.fbead{flex:0 0 auto}
.fname{font:600 12px var(--serif);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fmeter{width:96px;height:8px;border-radius:2px;background:var(--paper-shade);position:relative;overflow:hidden;flex:0 0 auto}
.fmeter .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f0d896,#a2712a);}
.fmeter.cap .fill{background:linear-gradient(90deg,#e7cd92,#b2832d)}
.fsealrow{display:flex;align-items:center;gap:7px;padding:2px 0;opacity:.85}
.fsealrow .name{font:600 11px var(--serif);color:var(--ink-45);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsealrow .seal-note{font:700 8px var(--serif);letter-spacing:.06em;text-transform:uppercase;color:var(--cinn-deep);background:rgba(139,48,40,.10);border:1px solid rgba(139,48,40,.3);border-radius:2px;padding:1px 5px;flex:0 0 auto}
.wind{display:flex;align-items:center;gap:7px;font:600 10.5px var(--serif);}
.wind .wv{font-weight:800;margin-left:auto}

/* BELLOWS / FORGE / TRADE */
.bellows{display:grid;grid-template-columns:repeat(4,1fr);height:100%;align-items:end;gap:6px;padding-bottom:4px;}
.detent{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border-radius:4px;padding:6px 4px;position:relative;}
.detent .num{font:600 9.5px var(--serif);color:var(--ink-70);text-align:center;line-height:1.3}
.detent.sel{background:rgba(15,111,90,.08)}
.detent.sel::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:3px;background:var(--jade-deep);border-radius:2px}
.flamewrap{height:60px;display:flex;align-items:flex-end;}
.forgebar{position:relative;height:18px;border-radius:3px;background:var(--paper-shade);overflow:visible;margin-top:6px}
.forgebar .ffill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#4e6b5e,#b2832d 55%,#a94835 80%,#8b3028);}
.forgebar .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-45)}
.forgebar .line80{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--cinnabar);}
.forgebar .line80 b{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font:700 7px var(--serif);color:var(--cinn-deep);white-space:nowrap}
.zone{font:700 8px var(--serif);letter-spacing:.05em;color:var(--ink-45);text-transform:uppercase}
.trade .tline{display:flex;justify-content:space-between;font:600 11px var(--serif);padding:1px 0}
.trade .tline .tv{font-weight:800}
.tbar{height:7px;border-radius:2px;background:var(--paper-shade);position:relative;overflow:hidden;margin-top:4px}
.tbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f0d896,#a2712a)}

/* NAV / ALERTS / RETURN */
.navrow{display:grid;grid-template-columns:1fr auto;gap:13px;align-items:center;}
.nav-left{display:flex;align-items:center;height:100%;padding-left:6px}
.nav-right{display:flex;align-items:center;gap:10px;height:100%;justify-content:flex-end;padding-right:6px}
.nav-right .reason{font:600 9.5px var(--serif);color:var(--cinn-deep);margin-right:6px}
.alerts{position:absolute;left:24px;top:14px;z-index:6;display:flex;flex-direction:column;gap:5px;max-width:520px}
.alert{display:flex;align-items:center;gap:7px;font:600 10.5px var(--serif);padding:4px 10px;border-radius:3px;background:rgba(243,234,215,.94);box-shadow:0 2px 6px rgba(30,20,10,.3);}
.alert.cinn{border-left:3px solid var(--cinnabar)}.alert.gold{border-left:3px solid var(--gold)}.alert.jade{border-left:3px solid var(--jade-deep)}.alert.ink{border-left:3px solid var(--ink-45)}
.alert .x{margin-left:auto;cursor:pointer;color:var(--ink-45);font-weight:800}
.return-wrap{position:absolute;inset:0;z-index:80;display:none;place-items:center;}
.return-wrap.show{display:grid}
.return-scrim{position:absolute;inset:0;background:rgba(20,14,8,.5)}
.return{position:relative;width:760px;max-height:460px;overflow:auto;border-radius:5px;padding:26px 30px 20px;
  background:linear-gradient(168deg,var(--paper-warm),var(--paper) 42%,var(--paper-deep));box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 0 60px rgba(120,90,46,.06);}
.return .rrow{display:flex;justify-content:space-between;font:600 13px var(--serif);padding:3px 0}
.return .rrow .rv{font-weight:800}
.return h3{font:700 15px var(--serif);text-align:center;margin-bottom:4px;letter-spacing:.08em}
.return .lead{text-align:center;color:var(--ink-70);font-size:12px;margin-bottom:10px}

/* MOTES */
.fx-motes{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
.mote{position:absolute;width:5px;height:5px;border-radius:50%;z-index:4;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff2c8,#d9b35e 60%,transparent 75%);filter:blur(.3px) drop-shadow(0 0 4px rgba(231,200,120,.7));animation:moteUpK 6s linear infinite;}

/* CONTROL BAR */
.ctrl{position:fixed;left:8px;bottom:8px;z-index:200;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:rgba(20,14,8,.85);border:1px solid var(--gold-deep);border-radius:6px;padding:7px 10px;font:600 11px var(--serif);color:var(--gold-pale);max-width:96vw}
.ctrl b{color:#fff;margin-right:2px}
.ctrl select,.ctrl button{font:600 11px var(--serif);background:#2a2013;color:var(--gold-pale);border:1px solid var(--gold-deep);border-radius:3px;padding:2px 6px;cursor:pointer}
.ctrl .grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid rgba(178,131,45,.3)}
.ctrl input[type=range]{width:90px}

/* KEYFRAMES */
@keyframes ovBreathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
@keyframes qiflowK{to{stroke-dashoffset:-64}}
@keyframes spinSlowK{to{transform:rotate(360deg)}}
@keyframes mpulseK{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.55);opacity:1}}
@keyframes twkK{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes weakPK{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.16)}}
@keyframes flickK{0%,100%{opacity:.85;transform:scaleY(1)}30%{opacity:1;transform:scaleY(1.07)}60%{opacity:.78;transform:scaleY(.95)}}
@keyframes glowPulseK{0%,100%{opacity:.5}50%{opacity:.95}}
@keyframes swayK{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
@keyframes moteUpK{0%{transform:translateY(10px) translateX(0);opacity:0}14%{opacity:.85}55%{transform:translateY(-26px) translateX(4px)}88%{opacity:.45}100%{transform:translateY(-58px) translateX(-3px);opacity:0}}
@keyframes heatShimK{0%,100%{opacity:.5}50%{opacity:.95}}
@keyframes smokeRiseK{0%{opacity:0;transform:translateY(0) scaleX(1)}20%{opacity:.5}100%{opacity:0;transform:translateY(-120px) scaleX(1.6)}}
@keyframes driftK{0%{transform:translateX(0)}50%{transform:translateX(40px)}100%{transform:translateX(0)}}
.qiflow{stroke-dasharray:3 13;animation:qiflowK var(--th-qi-dur,2.4s) linear infinite;}
.breatheA{transform-box:fill-box;transform-origin:center;animation:ovBreathe var(--th-breath-dur,5.6s) ease-in-out infinite;}
.mp{transform-box:fill-box;transform-origin:center;animation:mpulseK 3s ease-in-out infinite;}
.twk{animation:twkK 3.8s ease-in-out infinite;}
.weakp{transform-box:fill-box;transform-origin:center;animation:weakPK 2.6s ease-in-out infinite;}
.spinG{animation:spinSlowK 80s linear infinite;}

<script>
const PT=(cx,cy,r,a)=>[cx+r*Math.cos((a-90)*Math.PI/180),cy+r*Math.sin((a-90)*Math.PI/180)];
const arc=(cx,cy,r,a0,a1)=>{const[x0,y0]=PT(cx,cy,r,a0),[x1,y1]=PT(cx,cy,r,a1);return `M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${Math.abs(a1-a0)>180?1:0} 1 ${x1.toFixed(1)},${y1.toFixed(1)}`;};
function waxSeal(chars,size,rot,jade){
  const C=size/2,r=size/2-2,N=22;let p='';
  for(let i=0;i<=N;i++){const a=i/N*2*Math.PI;const rr=r*(0.90+0.06*Math.sin(i*2.7+1.3)+0.04*Math.cos(i*1.6+0.5));const x=C+rr*Math.cos(a),y=C+rr*Math.sin(a);p+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)+' ';}
  p+='Z';const cs=[...chars],fs=size*(cs.length>2?0.27:0.32),gap=fs*1.02,y0=C-(cs.length-1)*gap/2;
  const txt=cs.map((c,i)=>`<tspan x="${C}" y="${(y0+i*gap+fs*0.34).toFixed(1)}">${c}</tspan>`).join('');
  const fill=jade?'url(#jadeRad)':'url(#cinnDisc)',str=jade?'#1c3128':'#54190f',inner=jade?'rgba(220,240,225,.4)':'rgba(255,214,196,.4)',tx=jade?'#e9efe2':'#f4dccb';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(${rot||0}deg);overflow:visible"><path d="${p}" fill="${fill}" stroke="${str}" stroke-width="1.3"/><path d="${p}" fill="none" stroke="${inner}" stroke-width=".8" transform="translate(${C} ${C}) scale(.82) translate(${-C} ${-C})"/><text text-anchor="middle" font-family="var(--kai)" font-weight="700" font-size="${fs.toFixed(1)}" fill="${tx}">${txt}</text></svg>`;
}
function medallion(glyph,col){return `<span style="width:26px;height:26px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 36% 30%,#f0d99e,#9a6f24 70%,#684a16);display:inline-grid;place-items:center;font-family:var(--kai);font-size:14px;color:${col||'#2a1d08'};border:1px solid #5e4214;box-shadow:inset 0 1px 1px rgba(255,250,235,.5)">${glyph}</span>`;}
const nodeFill=st=>st==='lit'?'url(#goldRad)':st==='spine'?'url(#jadeRad)':st==='weak'?'url(#cinnDisc)':st==='socket'?'none':'var(--paper-deep)';
const nodeStroke=st=>st==='lit'?'#6e4c16':st==='spine'?'#1c3128':st==='weak'?'#54190f':st==='socket'?'rgba(120,90,46,.5)':'var(--ink-25)';
const qiDur=m=>`${(3.0-Math.min(2.25,Math.max(0.5,m))*0.8).toFixed(2)}s`;
const capStateOf=p=>p>=1?'capped':p>=0.92?'near_cap':'open';
const tierOf=f=>f>=80?'overworked':f>=60?'strained':f>=35?'tiring':'fresh';
const dampOf=f=>Math.max(0.4,Math.min(1,1-Math.max(0,f-40)*0.009));
const pipN=r=>r<=0.88?2:r<=0.95?3:r<=1.00?4:5;
const fmt=n=>Number.isFinite(n)?(Math.round(n*100)/100):0;
function cornerURI(col){const s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><g fill='none' stroke='${col}' stroke-width='2' stroke-linecap='round'><path d='M8,72 C8,36 24,16 60,12'/><path d='M14,72 C14,42 30,24 62,20' opacity='.6'/><circle cx='62' cy='13' r='3.4' fill='${col}' stroke='none'/><path d='M8,72 q-2,-10 4,-16' /></g></svg>`;return 'data:image/svg+xml,'+encodeURIComponent(s);}

/* ===== v2 constants ===== */
const CAPS=[40,60,80,100,125,150,170];
const REALMS=['Qi Condensation','Foundation Establishment','Core Formation','Nascent Soul','Spirit Severing','Tribulation','Immortal Ascension'];

/* ===== CURRENT DATA ===== */
function currentData(){
  const P=PATHS[S.path],T=THEME[S.path],f=S.fatigue,tier=tierOf(f),damp=dampOf(f);
  const realm=Math.max(1,Math.min(7,S.realm)),cap=CAPS[realm-1];
  // build meridian view
  const meridians=P.meridians.map((m,i)=>{
    const unlocked=i<realm,root=ROOTS[m.rootKey];
    const mcap=Math.round(cap*root.cap);
    const rating=unlocked?Math.min(mcap,Math.round(m.invest*mcap)):0;
    const capPct=unlocked?Math.min(1,rating/mcap):0;
    return {...m,index:i,unlocked,root,rootKey:m.rootKey,cap:mcap,rating,capPct,capState:unlocked?capStateOf(capPct):'locked',unlockRealm:i+1};
  });
  const unlockedList=meridians.filter(m=>m.unlocked);
  // clamp active to an unlocked meridian
  let ai=S.activeIndex; if(!meridians[ai]||!meridians[ai].unlocked) ai=realm-1; S.activeIndex=ai;
  const active=meridians[ai];
  meridians.forEach(m=>m.isActive=(m.index===ai));
  // bottleneck = lowest capPct among unlocked
  let bn=null; unlockedList.forEach(m=>{if(!bn||m.capPct<bn.capPct)bn=m;}); if(bn)bn.isBottleneck=true;
  const nextSealed=meridians.find(m=>!m.unlocked);
  // tier 1/0 values scale gently with realm
  const scale=0.72+realm*0.16;
  const axes=AXES.map(([zi,name,base])=>({zi,name,v:Math.round(base*scale)}));
  const baseStats=BASE.map(([zi,name,base])=>({zi,name,v:name==='Luck'?null:Math.round(base*scale),fixed:name==='Luck'}));
  // rate breakdown (the Tempering Winds, consolidated)
  const intens=INTENSITIES.find(i=>i.id===S.intensity)||INTENSITIES[1];
  const perc=baseStats.find(s=>s.name==='Perception').v;
  const mastMult=1+active.mastery.rank*0.012;
  const percMult=1+(perc-20)*0.006;
  const rootMult=active.root.rate;
  const compMult=active.comp;
  const capFall=capFalloffOf(active.capPct);
  const factors=[
    {k:'regimen mastery',v:mastMult,dir:'up',note:'rank '+active.mastery.rank},
    {k:'intensity',v:intens.m,dir:intens.m>1?'up':intens.m<1?'down':'flat',note:intens.label},
    {k:'perception',v:percMult,dir:percMult>1?'up':'flat',note:'悟 '+perc},
    {k:'spirit root',v:rootMult,dir:rootMult>1?'up':'down',note:active.root.lbl},
    {k:'fatigue',v:damp,dir:damp<1?(damp<=0.5?'bad':'down'):'flat',note:tier[0].toUpperCase()+tier.slice(1)+' '+f},
    {k:'comprehension',v:compMult,dir:compMult<1?'down':'flat',note:compMult<1?Math.round(compMult*100)+'% learned':'mastered'},
    {k:'cap falloff',v:capFall,dir:capFall<1?'down':'flat',note:active.capState==='capped'?'at cap → mastery':active.capState==='near_cap'?'near cap':''},
    {k:'path affinity',v:1.20,dir:'up',note:P.glyph+' resonance'},
    {k:'offline',v:1.00,dir:'flat',note:'online — full rate'},
    {k:'form memory',v:1.00,dir:'flat',note:'no prestige floor yet'}
  ];
  const mult=Math.min(2.25,factors.reduce((a,x)=>a*x.v,1));
  // alerts
  const alerts=[];
  if(f>=60)alerts.push({tone:'cinn',glyph:'火',text:`Forge runs hot — fatigue ${f}. Practice eases at 80.`});
  if(active.capState==='capped')alerts.push({tone:'gold',glyph:'滿',text:`${active.name} reached its realm cap — overflow now feeds mastery.`});
  if(active.comp<1)alerts.push({tone:'jade',glyph:'悟',text:`Still comprehending ${active.name} — ${Math.round(active.comp*100)}% learned; rate climbs as you grasp the form.`});
  if(nextSealed)alerts.push({tone:'ink',glyph:'封',text:`Next breakthrough (${REALMS[realm]}) unseals ${nextSealed.name}.`});
  if(S.showReturn)alerts.push({tone:'jade',glyph:'歸',text:'Welcome back — see what the hall kept for you.'});
  if(S.rm)alerts.push({tone:'ink',glyph:'止',text:'Reduced-motion shown with stable marks.'});
  const statusLabel={active:`Tempering · ${intens.label}`,idle:'Ready to Temper',blocked_by_combat:'Court Closed · In Combat',blocked_by_activity:'Hall Occupied · Gathering',no_path:'No Path Chosen'}[S.status];
  return {P,T,realm,realmName:REALMS[realm-1],cap,meridians,unlockedList,activeIndex:ai,active,nextUnlock:nextSealed,
    f,tier,damp,intens,factors,mult,axes,baseStats,alerts,statusLabel,cultPct:S.cultPct,
    startEnabled:S.status==='idle',startLabel:S.status==='active'?'Tempering':'Begin Tempering',
    disabledReason:S.status==='blocked_by_combat'?'Combat must end before you may train.':S.status==='blocked_by_activity'?'Another activity holds the hall.':S.status==='no_path'?'Choose a path at Life Start.':'',
    offlineSummary:S.showReturn?{minutes:'5h 12m',meridian:active.name,gained:'+22 xp',ratings:'3 ratings',mastery:'+140',fatigue:'+44',tier:'Strained',downgrades:3,passive:'+4 xp from 2 fights'}:null};
}

/* ===== MERIDIAN CHANNEL (7 nodes: sealed → unlocked → active) ===== */
function buildMeridianChannel(d){
  const T=d.T,mers=d.meridians,ai=d.activeIndex,realm=d.realm;
  const ys=[452,400,348,296,244,192,138],x=606;
  const highY=ys[realm-1],show=S.status!=='no_path',active=S.status==='active'&&!S.rm;
  let s='';
  s+=`<line x1="${x}" y1="470" x2="${x}" y2="138" stroke="rgba(120,96,52,.18)" stroke-width="6" stroke-linecap="round"/>`;
  if(show)s+=`<line x1="${x}" y1="470" x2="${x}" y2="${highY}" stroke="${T.meridP}" stroke-width="6" stroke-linecap="round" filter="url(#glowJ)" opacity=".85"/>`;
  if(show&&active&&ai>=0)s+=`<line x1="${x}" y1="470" x2="${x}" y2="${ys[ai]}" stroke="#fff6da" stroke-width="2.4" class="qiflow"/>`;
  mers.forEach((m,i)=>{
    const y=ys[i];
    if(!m.unlocked){s+=`<g transform="translate(${x-11},${y-11})" opacity=".92">${waxSeal('封',22,-5)}</g>`;return;}
    const isA=(i===ai),capped=m.capState==='capped',bottle=m.isBottleneck;
    const col=capped?'url(#goldRad)':bottle?'url(#cinnDisc)':isA?T.core:'url(#jadeRad)';
    const r=isA?13:9;
    if(isA)s+=`<circle cx="${x}" cy="${y}" r="22" fill="${T.core}" opacity=".45" class="breatheA"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="${capped?'#6e4c16':bottle?'#54190f':isA?T.rim:'#1c3128'}" stroke-width="1.6" ${isA?'filter="url(#glowJ)" class="mp"':(bottle&&!S.rm?'class="weakp"':'')}/>`;
    if(capped)s+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-family="var(--kai)" font-size="${isA?11:9}" fill="#3a2a0e">滿</text>`;
  });
  if(show&&ai>=0){
    const m=mers[ai],y=ys[ai],capped=m.capState==='capped';
    s+=`<line x1="${x+16}" y1="${y}" x2="${x+46}" y2="${y}" stroke="${T.rim}" stroke-width="1.2" opacity=".7"/>`;
    s+=`<text x="${x+52}" y="${y-3}" font-family="var(--serif)" font-weight="800" font-size="13" fill="#2f2a22" paint-order="stroke" stroke="rgba(243,234,215,.92)" stroke-width="3.4">${m.name}</text>`;
    s+=`<text x="${x+52}" y="${y+13}" font-family="var(--serif)" font-weight="800" font-size="12" fill="${m.capState==='open'?'#0f6f5a':'#84591b'}" paint-order="stroke" stroke="rgba(243,234,215,.92)" stroke-width="3.2">${m.rating}/${m.cap} · ${m.root.lbl}</text>`;
    if(capped)s+=`<text x="${x+52}" y="${y+28}" font-family="var(--serif)" font-weight="700" font-size="9" fill="#84591b">overflow → mastery</text>`;
  }
  return s;
}

  const host=document.getElementById('const-list');
  const cell=s=>`<div class="ccell"><span style="font-family:var(--kai);color:var(--gold-deep);font-size:10px">${s.zi}</span><span class="cn">${s.name}</span><span class="cv">${s.v===null?'<span class="cg">'+LUCK_GRADE+'</span>':s.v}</span></div>`;
  host.innerHTML=`<div class="tier-head jade">Cultivation Axes · 修为</div><div class="cgrid">${d.axes.map(cell).join('')}</div>
    <div class="tier-head">Mortal Foundation · 体</div><div class="cgrid">${d.baseStats.map(cell).join('')}</div>
    <div class="micro" style="margin-top:7px;color:var(--ink-45);line-height:1.4">Shared tiers — present from Qi Condensation, grown by the cultivation loop &amp; pills. The Court tempers <b>path meridians</b>; one at a time.</div>`;
}
/* ===== THIS PRACTICE (single active meridian) ===== */
function renderTrade(d){const m=d.active,base=2.4*d.mult,c=document.getElementById('trade-c');
  if(S.status==='blocked_by_combat'||S.status==='blocked_by_activity'){c.innerHTML=`<div class="micro" style="margin-top:18px">Paused — ${S.status==='blocked_by_combat'?'combat in progress':'the hall is occupied'}.</div>`;return;}
  if(S.status==='no_path'){c.innerHTML=`<div class="micro" style="margin-top:18px">—</div>`;return;}
  const toNext=(5/(base*0.9));
  c.innerHTML=`<div class="micro" style="margin-bottom:4px">tempering <b>${m.name}</b>, at ${d.intens.label}:</div>
    <div class="tline"><span style="color:var(--ink)">${m.name} <span style="font-family:var(--kai)">${m.zi}</span></span><span class="tv">≈ +${base.toFixed(1)} xp/min</span></div>
    <div class="tline"><span>regimen mastery</span><span class="tv">≈ +${(base*0.33).toFixed(1)}/min</span></div>
    <div class="tline"><span style="color:var(--gold-deep)">forge heat</span><span class="tv" style="color:var(--gold-deep)">+${d.intens.fpm}/min</span></div>
    <div class="pp-sec">also in combat · passive</div>
    <div class="tline"><span style="color:var(--jade-deep)">${m.trigger}</span><span class="tv" style="color:var(--jade-deep)">≈ +${(base*0.15).toFixed(1)}/min</span></div>
    ${m.capState==='capped'?`<div class="tline" style="border-top:1px solid var(--ink-12);margin-top:3px;padding-top:3px"><span style="color:var(--gold-deep)">at realm cap</span><span class="tv" style="color:var(--gold-deep)">overflow → mastery</span></div>`:`<div class="micro" style="margin-top:6px">to next rating (${m.rating}→${m.rating+1})</div><div class="tbar"><span class="fill" style="width:${Math.round((m.rating%5)/5*100)}%"></span></div><div class="micro" style="margin-top:2px">~${toNext.toFixed(1)} min</div>`}`;}
/* ===== RETURN ===== */
function renderReturn(d){const wrap=document.getElementById('return-wrap');
  if(!d.offlineSummary){wrap.classList.remove('show');return;}const o=d.offlineSummary;
  document.getElementById('return-card').innerHTML=`<div style="position:absolute;left:18px;top:12px">${waxSeal('歸',40,-6,true)}</div>
    <h3>WHILE YOU WERE AWAY</h3><div class="lead">The hall tempered <b>${o.meridian}</b> for ${o.minutes}.</div>
    <div class="rrow"><span>${o.meridian}</span><span class="rv">${o.gained} <span class="chip jade">${o.ratings}</span></span></div>
    <div class="rrow"><span>Regimen mastery</span><span class="rv">${o.mastery}</span></div>
    <div class="rrow"><span style="color:var(--jade-deep)">Combat · passive</span><span class="rv" style="color:var(--jade-deep)">${o.passive}</span></div>
    <div class="rrow" style="border-top:1px solid var(--ink-12);margin-top:4px;padding-top:4px"><span style="color:var(--gold-deep)">Forge heat</span><span class="rv" style="color:var(--gold-deep)">${o.fatigue} → ${o.tier}</span></div>
    ${o.downgrades>0?`<div class="micro" style="margin-top:6px;color:var(--ink-70)">⤓ Your Limit eased ${o.downgrades} times as the forge ran hot.</div>`:''}
    <div style="text-align:right;margin-top:12px"><span class="btn jade" id="btn-resume">Resume</span></div>`;
  wrap.classList.add('show');const close=()=>{S.showReturn=false;syncCtrl();renderAll();};
  document.getElementById('btn-resume').onclick=close;document.getElementById('return-scrim').onclick=close;}
/* ===== BELLOWS ===== */
function flameSVG(h,lit){const H=20+h*10;return `<svg width="34" height="${H}" viewBox="0 0 34 ${H}" class="${lit?'flame':''}"><path d="M17,${H} C2,${H-12} 8,${H*0.4} 14,${H*0.28} C13,${H*0.5} 20,${H*0.46} 19,${H*0.62} C24,${H*0.4} 30,${H-14} 17,${H}Z" fill="${lit?'url(#emberCore)':'rgba(120,90,46,.25)'}"/>${lit?`<path d="M17,${H} C9,${H-8} 13,${H*0.55} 17,${H*0.46} C21,${H*0.55} 25,${H-8} 17,${H}Z" fill="#fff4d6" opacity=".7"/>`:''}</svg>`;}
function renderBellows(d){const host=document.getElementById('bellows-list');
  host.innerHTML=INTENSITIES.map(it=>{const sel=it.id===S.intensity,lit=sel&&S.status==='active'&&!S.rm;
    return `<div class="detent ${sel?'sel':''}" data-int="${it.id}" tabindex="0" role="button" aria-pressed="${sel}" aria-label="${it.label}, ${it.xp} experience, ${it.fpm} fatigue per minute">
      <span>${medallion(it.glyph,sel?'#1c3128':'#2a1d08')}</span>
      <div style="font:700 11px var(--serif);color:${sel?'var(--jade-deep)':'var(--ink-70)'}">${it.label}</div>
      <div class="flamewrap">${flameSVG(it.h,lit||sel)}</div>
      <div class="num">${it.xp} xp · ${it.fpm}/min</div></div>`;}).join('');
  host.querySelectorAll('.detent').forEach(el=>el.onclick=()=>{S.intensity=el.dataset.int;syncCtrl();renderAll();});}

/* ===== FORGE HEAT ===== */
function renderForge(d){const f=d.f,tier=d.tier,chip=tier==='fresh'?'jade':tier==='overworked'?'cinn':'gold';
  document.getElementById('forge-c').innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-top:2px"><span class="zone">fresh</span><span class="zone">tiring</span><span class="zone">strained</span><span class="zone" style="color:var(--cinn-deep)">overworked</span></div>
    <div class="forgebar"><div class="ffill" style="width:${f}%"></div><div class="tick" style="left:35%"></div><div class="tick" style="left:60%"></div><div class="line80" style="left:80%"><b>downgrade</b></div>
      ${f>=80&&!S.rm?`<div class="ffill" style="left:80%;width:${f-80}%;animation:heatShimK 1.4s ease-in-out infinite;background:linear-gradient(90deg,#a94835,#8b3028)"></div>`:''}</div>
    <div style="display:flex;justify-content:space-between;font:600 8px var(--serif);color:var(--ink-45);margin-top:2px"><span>0</span><span>35</span><span>60</span><span>80</span><span>100</span></div>
    <div style="margin-top:9px;display:flex;align-items:center;gap:8px"><span class="chip ${chip}">${tier[0].toUpperCase()+tier.slice(1)}</span><span class="val">${f} / 100</span><span class="micro">output ×${fmt(d.damp).toFixed(2)}</span>${tier==='overworked'?'<span class="micro" style="color:var(--cinn-deep)">⤓ practice eases</span>':''}</div>`;}
/* ===== ACTIONS ===== */
function renderActions(d){const host=document.getElementById('nav-actions');
  host.innerHTML=`${!d.startEnabled&&d.disabledReason?`<span class="reason">${d.disabledReason}</span>`:''}
    <span class="btn jade big ${d.startEnabled?'':'is-disabled'}" id="btn-start" ${d.startEnabled?'tabindex="0"':''} aria-disabled="${!d.startEnabled}">${d.startLabel}</span>
    <span class="btn ${S.status==='active'?'':'is-disabled'}" id="btn-cease" aria-disabled="${S.status!=='active'}">Cease</span>`;
  const bs=document.getElementById('btn-start');if(bs&&d.startEnabled)bs.onclick=()=>{S.status='active';syncCtrl();renderAll();};
  const bc=document.getElementById('btn-cease');if(bc&&S.status==='active')bc.onclick=()=>{S.status='idle';syncCtrl();renderAll();};}
/* ===== MOTES (per-path) ===== */
function mountMotes(d){const host=document.getElementById('th-motes');host.setAttribute('data-th','training-hall-vfx-motes');host.innerHTML='';
  if(S.rm)return;const count={active:24,idle:12,blocked_by_combat:6,blocked_by_activity:6,no_path:0}[S.status]||0;const T=d.T;
  for(let i=0;i<count;i++){const m=document.createElement('div');m.className='mote';m.setAttribute('data-th','training-hall-vfx-mote');
    m.style.left=(50+(Math.random()*18-9))+'%';m.style.top=(56+Math.random()*10)+'%';
    m.style.background=`radial-gradient(circle at 35% 30%,${T.moteCols[0]},${T.moteCols[1]} 60%,transparent 75%)`;
    m.style.width=m.style.height=T.moteW+'px';
    m.style.animationDuration=((5.4+Math.random()*1.2)*T.moteDur).toFixed(2)+'s';m.style.animationDelay=(Math.random()*6).toFixed(2)+'s';
    if(d.P.scenery==='heaven')m.classList.add('twk');host.appendChild(m);}}

/* ===== MOTION VARS ===== */
function setMotion(d){const r=document.getElementById('room');
  r.style.setProperty('--th-fill-p',(d.active.rating/d.active.cap).toFixed(3));
  r.style.setProperty('--th-qi-dur',qiDur(d.mult));
  r.style.setProperty('--th-breath-dur',(6.8-Math.min(1,d.mult/2.25)*2.4).toFixed(2)+'s');
  r.style.setProperty('--th-heat',(d.f/100).toFixed(3));}
/* ===== CONTROL BAR ===== */
function buildCtrl(){const c=document.getElementById('ctrl');
  c.innerHTML=`<div class="grp"><b>锤炼堂</b> Tempering Court</div>
    <div class="grp"><b>Path</b><select id="c-path"><option value="martial">Martial 武</option><option value="earth">Earth 地</option><option value="heaven">Heaven 天</option></select></div>
    <div class="grp"><b>Realm</b><select id="c-realm"></select></div>
    <div class="grp"><b>Tempering</b><select id="c-mer"></select></div>
    <div class="grp"><b>Status</b><select id="c-status"><option value="active">active</option><option value="idle">idle</option><option value="blocked_by_combat">blocked: combat</option><option value="blocked_by_activity">blocked: activity</option><option value="no_path">no path</option></select></div>
    <div class="grp"><b>Intensity</b><select id="c-int"><option value="quiet">Quiet</option><option value="steady">Steady</option><option value="harsh">Harsh</option><option value="limit">Limit</option></select></div>
    <div class="grp"><b>Fatigue</b> <input type="range" id="c-fat" min="0" max="100" step="1"> <span id="c-fatv"></span></div>
    <div class="grp"><label><input type="checkbox" id="c-rm"> reduced-motion</label></div>
    <div class="grp"><button id="c-return">offline return ▸</button></div>`;
  document.getElementById('c-path').onchange=e=>{S.path=e.target.value;if(S.activeIndex>S.realm-1)S.activeIndex=S.realm-1;renderAll();};
  document.getElementById('c-realm').onchange=e=>{S.realm=+e.target.value;if(S.activeIndex>S.realm-1)S.activeIndex=S.realm-1;renderAll();};
  document.getElementById('c-mer').onchange=e=>{S.activeIndex=+e.target.value;renderAll();};
  document.getElementById('c-status').onchange=e=>{S.status=e.target.value;renderAll();};
  document.getElementById('c-int').onchange=e=>{S.intensity=e.target.value;renderAll();};
  document.getElementById('c-fat').oninput=e=>{S.fatigue=+e.target.value;document.getElementById('c-fatv').textContent=S.fatigue;renderAll();};
  document.getElementById('c-rm').onchange=e=>{S.rm=e.target.checked;renderAll();};
  document.getElementById('c-return').onclick=()=>{S.showReturn=!S.showReturn;renderAll();};syncCtrl();}
function syncCtrl(){const set=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v;};
  const rs=document.getElementById('c-realm');if(rs)rs.innerHTML=REALMS.map((r,i)=>`<option value="${i+1}">R${i+1} · ${r}</option>`).join('');
  const ms=document.getElementById('c-mer');if(ms){const P=PATHS[S.path];ms.innerHTML=P.meridians.map((m,i)=>i<S.realm?`<option value="${i}">${m.name}</option>`:'').join('');}
  set('c-path',S.path);set('c-realm',S.realm);set('c-mer',S.activeIndex);set('c-status',S.status);set('c-int',S.intensity);set('c-fat',S.fatigue);
  const fv=document.getElementById('c-fatv');if(fv)fv.textContent=S.fatigue;const rm=document.getElementById('c-rm');if(rm)rm.checked=S.rm;}
/* ===== RENDER ALL ===== */
function renderAll(){document.body.classList.toggle('rm',S.rm);const d=currentData();
  renderLintel(d);renderShelf(d);renderRoom(d);renderMeridians(d);renderConstitution(d);renderBellows(d);renderForge(d);renderTrade(d);renderActions(d);renderReturn(d);mountMotes(d);setMotion(d);syncCtrl();}
/* ===== SCALE ===== */
function fitScale(){const stage=document.getElementById('stage');const s=Math.min(window.innerWidth/2048,window.innerHeight/1152);
  stage.style.transform='scale('+s+')';document.querySelector('.th-viewport').style.height=(1152*s)+'px';}
window.addEventListener('resize',fitScale);

/* ===== BOOT ===== */
buildCtrl();renderAll();fitScale();
/* ===== FAKE PRACTICE LOOP (artifact only) ===== */
let _t=0;setInterval(()=>{if(S.rm||S.status!=='active')return;if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;_t++;
  const d=currentData();const fillP=Math.min(1,d.active.rating/d.active.cap+(Math.sin(_t/40)+1)/40);
  document.getElementById('room').style.setProperty('--th-fill-p',fillP.toFixed(3));},250);
</script>
</body>
</html>
